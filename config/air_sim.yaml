# Laptop loopback: synthetic H.265 video + PX4 SITL, sending to localhost.

mavlink:
  url: udpin:0.0.0.0:14540   # PX4 SITL's onboard (offboard API) MAVLink port
  baud: 57600                # unused for UDP
  source_system: 1
  source_component: 191
  rates_hz:
    attitude: 100
    position: 50
    gimbal: 50               # SITL without a gimbal model sends none; frames get NO_GIMBAL
  clock_window_s: 10
  max_hold_s: 0.2

camera:
  source: >-
    videotestsrc is-live=true pattern=ball
    ! video/x-raw,width=1280,height=720,framerate=30/1
    ! x265enc tune=zerolatency speed-preset=ultrafast bitrate=4000 key-int-max=30
  latency_ms: 0

sink: "udpsink host=127.0.0.1 port=5600 sync=false async=false"

stats_period_s: 5
